name: tests
# Runs the full headless test suite on every push and pull request.
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Import project
        run: ./godot --headless --path . --import || true
      - name: Run tests
        run: |
          ./godot --headless --path . -s tests/run_tests.gd 2>&1 | tee test.log
          grep -E "passed, 0 failed" test.log
